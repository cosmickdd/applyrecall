services:
  # ApplyRecall FastAPI Web Service
  - type: web
    name: applyrecall-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m app.cli migrate
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: starter
    rootDir: backend
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: API_URL
        sync: false

  # ApplyRecall Reminder Background Worker
  - type: worker
    name: applyrecall-reminder-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.worker
    plan: starter
    rootDir: backend
    envVars:
      - key: APP_ENV
        value: production
      - key: WORKER_DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WORKER_BATCH_SIZE
        value: "10"
      - key: WORKER_LEASE_MINUTES
        value: "5"
